name: my-project

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: my-project-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: hiddenbar
      POSTGRES_PASSWORD: hiddenbar
      POSTGRES_DB: hiddenbar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hiddenbar']
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgis/postgis:16-3.4
    container_name: my-project-postgres-test
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: hiddenbar
      POSTGRES_PASSWORD: hiddenbar
      POSTGRES_DB: hiddenbar_test
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hiddenbar']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
